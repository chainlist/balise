name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Releases created with GITHUB_TOKEN never fire `on: release` workflows,
      # so the build must be dispatched explicitly (workflow_dispatch is exempt
      # from that restriction).
      - name: Trigger release build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo ${{ github.repository }} --ref main -f tag='${{ steps.release.outputs.tag_name }}'
